<script>
  /* Theme before paint: saved choice > system preference */
  (function () {
    var t = null; try { t = localStorage.getItem("sb-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    document.documentElement.classList.add("js");
    /* Logo intro: once per browser session, skipped for reduced motion */
    try {
      if (!sessionStorage.getItem("sb-intro") && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        sessionStorage.setItem("sb-intro", "1");
        document.documentElement.classList.add("intro-on");
        setTimeout(function () { document.documentElement.classList.remove("intro-on"); }, 3100);
      }
    } catch (e) {}
  })();
</script>
